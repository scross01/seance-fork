name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Install Node
        # The plugin suites import the plugins' TypeScript sources directly,
        # which needs unflagged type stripping (Node >= 22.18; stable in 24.12+).
        # Pin the major line the suites are exercised on locally (26.13.0) instead
        # of whatever Node the runner image happens to put on PATH. Any future
        # bump must rerun both suites in normal isolation mode, not merely under
        # --test-isolation=none diagnostics.
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install system dependencies
        run: |
          # Chrome is not a build dependency; its index can block apt updates.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libnotify-dev \
            libcanberra-dev \
            libx11-dev \
            libwayland-dev \
            libegl-dev \
            libgl-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libonig-dev \
            inotify-tools \
            openssl \
            xdotool \
            x11-xkb-utils \
            openbox \
            zsh \
            xvfb

      - name: Build
        run: make check-zig && make build

      - name: Unit tests
        run: G_DEBUG=fatal-criticals GTK_A11Y=none xvfb-run -a zig build test

      - name: Ghostty shutdown tests
        working-directory: ghostty
        run: >-
          zig build test -Dapp-runtime=none -Dskip-macos-artifacts=true
          -Dtest-filter='basic push and pop' -Dtest-filter='timed push'
          -Dtest-filter='cancelled push' -Dtest-filter='undelivered surface messages'

      - name: Codex wrapper tests
        run: python3 -m unittest discover -s tests -v

      - name: E2E tests
        run: xvfb-run zig build e2e

      - name: Required GUI regression suites
        # One strict step: every listed suite must run against the installed
        # binary, and a skip, missing file, zero-test module or failure fails
        # the job. Broad discovery above covers wrappers and plugins only.
        run: xvfb-run -a python3 -B tests/run_required_gui.py
        env:
          SEANCE_TEST_BINARY: ${{ github.workspace }}/AppDir/usr/bin/seance
          G_DEBUG: fatal-criticals
          GTK_A11Y: none
